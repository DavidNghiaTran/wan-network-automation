all:
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: Admin@123
    bgp_asn: 65000
    ospf_process_id: 1
    standard_vlans:
      - { id: 10, name: SALES_DEPT, gw: 11 }
      - { id: 20, name: IT_DEPT, gw: 21 }
      - { id: 30, name: VOIP_NET, gw: 33 }

  children:
    routers:
      hosts:
        R1-HQ:
          ansible_host: 192.168.254.201
        R2-Branch1:
          ansible_host: 192.168.254.202
        R3-Branch2:
          ansible_host: 192.168.254.203
        R4-Branch3:
          ansible_host: 192.168.254.204

    switches:
      hosts:
        SW1-HQ:
          ansible_host: 192.168.254.211
        SW2-Branch1:
          ansible_host: 192.168.254.212
        SW3-Branch2:
          ansible_host: 192.168.254.213
        SW4-Branch3:
          ansible_host: 192.168.254.214
