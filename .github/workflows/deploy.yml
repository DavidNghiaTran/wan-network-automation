name: NetDevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'backups/**'
  pull_request:
    branches: [ main ]

env:
  ANSIBLE_CONFIG: ./ansible.cfg
  VENV_BIN: /home/nghia/netdevops_env/bin

jobs:
  ci_validate:
    name: 1. CI - Kiem tra cu phap & Dry-Run
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Kiem tra cu phap YAML (yamllint)
        run: $VENV_BIN/yamllint -d "{extends: relaxed, rules: {line-length: disable}}" inventory/ playbooks/
      - name: Kiem tra cu phap Ansible Playbook
        run: $VENV_BIN/ansible-playbook playbooks/deploy_network.yml --syntax-check
      - name: Chay thu nghiem Dry-Run (--check)
        run: $VENV_BIN/ansible-playbook playbooks/deploy_network.yml --check

  cd_deploy:
    name: 2. CD - Trien khai cau hinh & Sao luu
    needs: ci_validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Day cau hinh xuong 8 thiet bi Cisco IOL
        run: $VENV_BIN/ansible-playbook playbooks/deploy_network.yml
      - name: Sao luu trang thai chuan sau trien khai
        run: |
          $VENV_BIN/python3 scripts/backup_nornir.py
          git config user.name "GitOps Automation Bot"
          git config user.email "bot@ptit.edu.vn"
          git add backups/latest/
          git diff --cached --quiet || (git commit -m "Auto-Backup: Cap nhat trang thai chuan sau CD" && git push)
